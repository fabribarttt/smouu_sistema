{% extends 'base.html' %}

{% block content %}

<div class="card p-4 shadow-lg mx-auto" style="max-width: 500px;">
    <h2 class="fs-2 pb-3">Registrar un cliente</h2>

    <form method="POST" action="{% url 'register_client' %}">
        {% csrf_token %}

        {% for field in form %}
        <div class="mb-3 d-flex align-items-center">
            <label for="{{ field.id_for_label }}" class="me-2">{{ field.label }}</label>
            {{ field }}
        </div>
        {% endfor %}

        <br />
        <button type="submit" class="btn btn-primary">Agregar cliente</button>

    </form>


</div>



{% endblock %}
